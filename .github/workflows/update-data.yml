# Optional: rebuild the site data weekly during the season and commit it.
# GitHub Pages (serving /docs) redeploys automatically on the push.
name: Update pitcher graph

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/build.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json
          git diff --staged --quiet || git commit -m "Update pitcher, batter and matchup data"
          git push
